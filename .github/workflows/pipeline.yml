name: DevSecOps & GitOps Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  devsecops-and-iac:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Trivy (DevSecOps Scanner)
        run: |
          if ! command -v trivy &> /dev/null; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          fi

      - name: Run Trivy IaC Security Scan (Terraform & K8s)
        run: |
          trivy config ./terraform --severity HIGH,CRITICAL --exit-code 0
          trivy config ./apps --severity HIGH,CRITICAL --exit-code 0

      - name: Terraform Init & Validate
        working-directory: ./terraform
        run: |
          terraform init
          terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply (On Merge to Main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve tfplan
