apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-app
  template:
    metadata:
      labels:
        app: ecommerce-app
    spec:
      containers:
      - name: ecommerce
        image: asia.gcr.io/gerry-production/ecommerce:600d850
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000

        envFrom:
        - secretRef:
            name: ecommerce-vault-env
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: ecommerce-app
  ports:
  - port: 80
    targetPort: 3000
