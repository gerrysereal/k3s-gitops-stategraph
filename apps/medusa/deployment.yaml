apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: medusa-external-secret
  namespace: default
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: medusa-vault-env
  dataFrom:
  - extract:
      key: medusa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-postgres
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medusa-postgres
  template:
    metadata:
      labels:
        app: medusa-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "medusa"
        - name: POSTGRES_PASSWORD
          value: "medusa_pass"
        - name: POSTGRES_DB
          value: "medusa"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: medusa-postgres
  namespace: default
spec:
  selector:
    app: medusa-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medusa-redis
  template:
    metadata:
      labels:
        app: medusa-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: medusa-redis
  namespace: default
spec:
  selector:
    app: medusa-redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medusa-app
  template:
    metadata:
      labels:
        app: medusa-app
    spec:
      containers:
      - name: medusa
        image: ghcr.io/gerrysereal/medusa:4acf198e
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
        envFrom:
        - secretRef:
            name: medusa-vault-env
---
apiVersion: v1
kind: Service
metadata:
  name: medusa-svc
  namespace: default
spec:
  selector:
    app: medusa-app
  ports:
  - port: 9000
    targetPort: 9000
