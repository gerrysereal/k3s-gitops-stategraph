apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medusa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gerrysereal/k3s-gitops-stategraph.git
    targetRevision: main
    path: apps/medusa
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: juice-shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gerrysereal/k3s-gitops-stategraph.git
    targetRevision: main
    path: apps/juice-shop
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
